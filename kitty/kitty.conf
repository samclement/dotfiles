# Base kitty config. Theme: dank-theme.conf. Tab bar: dank-tabs.conf.

font_family      family='JetBrainsMonoNL Nerd Font Mono' style=Light
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
adjust_line_height 140%

window_padding_width 12
background_opacity 1.0
cursor_shape block
cursor_blink_interval 1
scrollback_lines 3000

copy_on_select yes
strip_trailing_spaces smart
shell_integration enabled

# Key bindings for common actions
map ctrl+shift+n new_window
map ctrl+t new_tab
map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0

# Theme and tab bar own their own settings; nothing below overrides them.
include dank-theme.conf
include dank-tabs.conf

# Machine-local drop-ins, e.g. macOS-only options (background_blur,
# hide_window_decorations). Relative to this file, so for kitty at
# ~/.config/kitty/kitty.conf it reads ~/.config/kitty.local.d/*.conf.
# A glob, so the directory being absent is silent; an absolute path here
# crashes kitty on Python 3.13+ (pathlib rejects non-relative patterns).
# Not tracked. Template: kitty/local.conf.example
globinclude ../kitty.local.d/*.conf
