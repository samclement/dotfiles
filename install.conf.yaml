- clean: ['~']

- defaults:
    link:
      create: true
      relink: true

- link:
    ~/.config/television: television
    ~/.config/nvim: nvim
    ~/.zshrc: zsh/.zshrc
    ~/.config/kitty: kitty
    # fish ships no config of its own, but a previous machine may have one:
    # force replaces files here only, never the directory-based links above.
    ~/.config/fish/config.fish:
        path: fish/config.fish
        force: true
    ~/.config/fish/functions/fish_user_key_bindings.fish:
        path: fish/functions/fish_user_key_bindings.fish
        force: true
    ~/.config/tmux/tmux.conf: tmux/tmux.conf
    # pi writes ~/.pi/agent itself; link only the instructions file, replacing a local copy.
    ~/.pi/agent/AGENTS.md:
        path: pi/AGENTS.md
        force: true
    # Prompts are linked one by one: the others in ~/.pi/agent/prompts are local. The tk prompts are
    # owned by swhurl-astronaut, next to tk itself.
    ~/.pi/agent/prompts/task.md:
        path: ~/ghq/github.com/samclement/swhurl-astronaut/agent-cli/prompts/task.md
        force: true
    ~/.pi/agent/prompts/conduct.md:
        path: ~/ghq/github.com/samclement/swhurl-astronaut/agent-cli/prompts/conduct.md
        force: true
    ~/.pi/agent/extensions/cap-output:
        path: ~/ghq/github.com/samclement/swhurl-astronaut/agent-cli/pi/cap-output
        force: true
    ~/.pi/durable-subagents/config.json:
        path: pi/durable-subagents/config.json
        force: true
    ~/.gitconfig: git/.gitconfig
